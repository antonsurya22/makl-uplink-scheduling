collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_footprint
    odom_frame_id: odom

    # Final velocity safety chain:
    # velocity_smoother -> collision_monitor -> robot
    cmd_vel_in_topic: cmd_vel_mode
    cmd_vel_out_topic: cmd_vel

    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    # Stage-A functional safety zone.
    # Final threshold will be calibrated later in Stage B.
    polygons:
      - PolygonStop

    PolygonStop:
      type: polygon
      points: [0.22, 0.18,
               0.22, -0.18,
               -0.12, -0.18,
               -0.12, 0.18]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true

    # IMPORTANT:
    # Safety monitor receives LOCAL RAW LiDAR.
    observation_sources:
      - scan

    scan:
      type: scan
      topic: /scan
      enabled: true
